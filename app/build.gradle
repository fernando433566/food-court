plugins {
    id 'com.android.application' version '9.1.1'
}

// Release signing is optional: put the keystore details in keystore.properties (ignored by git)
// or point FOODCOURT_KEYSTORE_PROPERTIES at such a file. Without it, release builds are unsigned.
def signingFile = System.getenv('FOODCOURT_KEYSTORE_PROPERTIES') ?: rootProject.file('keystore.properties').path
def signing = new Properties()
if (new File(signingFile).isFile()) new File(signingFile).withInputStream { signing.load(it) }

android {
    namespace 'es.foodcourt'
    compileSdk 36
    defaultConfig {
        applicationId 'es.foodcourt'
        minSdk 23
        targetSdk 36
        versionCode 1
        versionName '0.1.0'
    }
    signingConfigs {
        release {
            if (signing['storeFile']) {
                storeFile file(signing['storeFile'])
                storePassword signing['storePassword']
                keyAlias signing['keyAlias']
                keyPassword signing['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (signing['storeFile']) signingConfig signingConfigs.release
        }
    }
}

dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.java-websocket:Java-WebSocket:1.6.0'
    implementation 'com.google.zxing:core:3.4.1'
    implementation 'androidx.core:core:1.17.0'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    constraints {
        implementation 'androidx.lifecycle:lifecycle-runtime:2.7.0'
        implementation 'androidx.profileinstaller:profileinstaller:1.3.1'
    }
}
